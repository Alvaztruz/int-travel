<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-4">
      <div class="text-center mb-4">
        <h2 class="mb-0">Travel Planner</h2>
      </div>

      <!-- Summary cards -->
      <!-- TODO: Sustituir por las tarjetas de resumen correspondientes -->

      <!-- Nav (pills) -->
      <ul class="nav nav-pills mb-3" id="main-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="tab-add-tab"
            data-bs-toggle="tab"
            data-bs-target="#tab-add"
            type="button"
            role="tab"
          >
            Agregar Ciudad
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-list-tab"
            data-bs-toggle="tab"
            data-bs-target="#tab-list"
            type="button"
            role="tab"
          >
            Destinos
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-add" role="tabpanel">
          <div class="row">
            <div class="col-12 mb-4">
              <form id="city-form" class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Ciudad</label>
                  <input id="city-name" class="form-control" required />
                </div>
                <div aria-live="polite" aria-atomic="true">
                  <div
                    id="alert-container"
                    class="position-fixed bottom-0 end-0 p-3"
                    style="z-index: 1080"
                  ></div>
                </div>
                <div class="col-md-4">
                  <label class="form-label">País</label>
                  <input id="city-country" class="form-control" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Fecha ida</label>
                  <input
                    id="city-date-from"
                    class="form-control"
                    type="date"
                    required
                  />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Fecha vuelta</label>
                  <input
                    id="city-date-to"
                    class="form-control"
                    type="date"
                    required
                  />
                </div>
                <div class="col-12">
                  <label class="form-label"
                    >Notas (actividades, detalles)</label
                  >
                  <textarea
                    id="city-notes"
                    class="form-control"
                    placeholder="Actividades a hacer, detalles extra"
                  ></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary">
                    Agregar Ciudad
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-list" role="tabpanel">
          <div class="row">
            <div class="col-12">
              <table class="table table-sm" id="cities-table">
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>País</th>
                    <th>Duración</th>
                    <th>Fecha ida</th>
                    <th>Fecha vuelta</th>
                    <th>Notas</th>
                  </tr>
                </thead>
                <tbody id="cities-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      <script type="module" src="main.js"></script>
    </div>
  </body>
</html>
